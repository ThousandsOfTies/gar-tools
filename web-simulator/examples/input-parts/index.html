<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAR · Reusable input parts</title>
<style>
  body { max-width: 1050px; margin: 32px auto; padding: 16px; font: 16px system-ui; color: #e9f3f8; background: #101820; }
  h1 { font-size: 1.7rem; } p { color: #afc3cf; line-height: 1.7; }
  .parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 24px; }
  section { min-width: 0; display: grid; align-content: start; gap: 18px; } h2 { font-size: 1rem; margin: 12px 0 0; }
  gar-event-log { --gar-panel: #0c1e2a; --gar-border: #285267; --gar-accent: #52d6c4; --gar-log-height: 120px; }
</style>
<h1>回して、押す。入力部品をそのまま試す。</h1>
<p>独立した2組のノブとゲームパッドです。ローカルデモのカウンタとログだけを更新します。<br>
ノブは−／＋で回転、クリックで押下。ノブにフォーカスすると矢印キーとホイールも使えます。</p>
<div class="parts">
  <section><h2>入力 A · 20 steps / turn</h2><gar-rotary id="rotary-a" steps-per-turn="20" value="0"></gar-rotary><gar-gamepad id="pad-a"></gar-gamepad><gar-event-log id="events-a" label="入力 A" max-entries="12"></gar-event-log></section>
  <section><h2>入力 B · 40 steps / turn</h2><gar-rotary id="rotary-b" steps-per-turn="40" value="5"></gar-rotary><gar-gamepad id="pad-b" button-a-label="入力1" button-b-label="入力2"></gar-gamepad><gar-event-log id="events-b" label="入力 B" max-entries="12"></gar-event-log></section>
</div>
<script type="module">
  import './gar-components/rotary.mjs';
  import './gar-components/gamepad.js';
  import './gar-components/event-log.mjs';
  for (const suffix of ['a', 'b']) {
    const rotary = document.getElementById(`rotary-${suffix}`);
    const log = document.getElementById(`events-${suffix}`);
    rotary.addEventListener('gar-rotary-input', ({ detail }) => {
      if (detail.type === 'rotate') rotary.value += detail.direction;
      log.append(JSON.stringify(detail));
    });
    document.getElementById(`pad-${suffix}`).addEventListener('gar-gamepad-input', ({ detail }) => log.append(JSON.stringify(detail)));
  }
</script>
</html>
